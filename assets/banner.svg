<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#100b26" />
    </linearGradient>

    <!-- Glowing Blue/Cyan Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Glowing Magenta/Red (Treason) Gradient -->
    <linearGradient id="magenta-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <!-- Accent Green (Aligned) Gradient -->
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#60efff" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* CSS Animations for Dynamic Aspect */
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.85; }
      100% { opacity: 0.3; }
    }

    @keyframes grid-move {
      0% { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }

    @keyframes scanline {
      0% { top: 0%; opacity: 0.1; }
      50% { opacity: 0.4; }
      100% { top: 100%; opacity: 0.1; }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    @keyframes glitch {
      0% { clip-path: inset(40% 0 61% 0); }
      20% { clip-path: inset(92% 0 1% 0); }
      40% { clip-path: inset(25% 0 58% 0); }
      60% { clip-path: inset(75% 0 5% 0); }
      80% { clip-path: inset(15% 0 80% 0); }
      100% { clip-path: inset(80% 0 15% 0); }
    }

    @keyframes nodeglow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255, 8, 68, 0.5)); }
      50% { transform: scale(1.2); filter: drop-shadow(0 0 15px rgba(255, 8, 68, 0.9)); }
    }

    @keyframes alignedglow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(0, 255, 135, 0.5)); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 10px rgba(0, 255, 135, 0.8)); }
    }

    .bg-grid {
      fill: none;
      stroke: #141c3a;
      stroke-width: 1;
      animation: grid-move 8s linear infinite;
    }

    .glowing-node-treason {
      animation: nodeglow 3s ease-in-out infinite;
      transform-origin: center;
    }

    .glowing-node-aligned {
      animation: alignedglow 4s ease-in-out infinite;
      transform-origin: center;
    }

    .title-text {
      font-family: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 54px;
      fill: #ffffff;
      letter-spacing: 4px;
    }

    .subtitle-text {
      font-family: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #8b9bb4;
      letter-spacing: 6px;
    }

    .pulse-glow {
      animation: pulse 4s ease-in-out infinite;
    }

    .floating-card {
      animation: float 6s ease-in-out infinite;
    }

    .connection-line {
      stroke-dasharray: 8, 8;
      animation: dash 30s linear infinite;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-gradient)" />

  <!-- Animated Grid (Translating pattern) -->
  <g class="pulse-glow">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#17224d" stroke-width="1.2" opacity="0.4" />
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)" />
  </g>

  <!-- Futuristic Cyber Details / Tech Lines -->
  <g opacity="0.3" class="pulse-glow">
    <line x1="100" y1="50" x2="1100" y2="50" stroke="#1f2d66" stroke-width="1" />
    <line x1="100" y1="350" x2="1100" y2="350" stroke="#1f2d66" stroke-width="1" />
    
    <!-- Tech corners -->
    <path d="M 80,70 L 80,40 L 110,40" fill="none" stroke="#00f2fe" stroke-width="2" />
    <path d="M 1120,70 L 1120,40 L 1090,40" fill="none" stroke="#00f2fe" stroke-width="2" />
    <path d="M 80,330 L 80,360 L 110,360" fill="none" stroke="#ff0844" stroke-width="2" />
    <path d="M 1120,330 L 1120,360 L 1090,360" fill="none" stroke="#ff0844" stroke-width="2" />
  </g>

  <!-- Graphical representation: Split Neural Net / Treason Mind Map (Right Side) -->
  <g class="floating-card" transform="translate(750, 60)">
    <!-- Neural Network Nodes & Links -->
    <!-- Connection lines -->
    <line x1="100" y1="140" x2="200" y2="70" stroke="#1f2d66" stroke-width="2" class="connection-line" />
    <line x1="100" y1="140" x2="200" y2="210" stroke="#1f2d66" stroke-width="2" />
    <line x1="200" y1="70" x2="300" y2="140" stroke="#1f2d66" stroke-width="2" />
    <line x1="200" y1="210" x2="300" y2="140" stroke="#ff0844" stroke-width="1.5" stroke-opacity="0.5" />
    
    <!-- Diverging Treason Pathway (Hidden/Red) -->
    <path d="M 200,210 Q 250,260 320,230" fill="none" stroke="url(#magenta-glow)" stroke-width="3" filter="url(#glow-soft)" />
    <line x1="300" y1="140" x2="320" y2="230" stroke="#ff0844" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Normal/Aligned Pathway (Green) -->
    <path d="M 200,70 Q 260,20 320,50" fill="none" stroke="url(#green-glow)" stroke-width="3" filter="url(#glow-soft)" />

    <!-- Nodes -->
    <!-- Input/Source Node (Blue) -->
    <circle cx="100" cy="140" r="12" fill="#00f2fe" filter="url(#glow-cyan)" />
    <circle cx="100" cy="140" r="6" fill="#ffffff" />
    <text x="100" y="170" fill="#00f2fe" font-family="monospace" font-size="10" text-anchor="middle">INPUT</text>

    <!-- Hidden Layer 1 - Aligned Node (Green) -->
    <circle cx="200" cy="70" r="10" fill="#00ff87" class="glowing-node-aligned" />
    
    <!-- Hidden Layer 1 - Latent Treason Node (Red) -->
    <circle cx="200" cy="210" r="10" fill="#ff0844" class="glowing-node-treason" />

    <!-- Output Layer - Aligned Behavior (Cyan) -->
    <circle cx="320" cy="50" r="12" fill="#00ff87" filter="url(#glow-soft)" />
    <circle cx="320" cy="50" r="5" fill="#ffffff" />
    <text x="320" y="30" fill="#00ff87" font-family="monospace" font-size="10" text-anchor="middle">COMPLIANCE</text>

    <!-- Output Layer - Treason Trigger (Magenta Glow) -->
    <circle cx="320" cy="230" r="16" fill="#ff0844" class="glowing-node-treason" filter="url(#glow-magenta)" />
    <circle cx="320" cy="230" r="8" fill="#ffffff" />
    <text x="320" y="270" fill="#ff0844" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">TREASON</text>
    
    <!-- Normal Output Node -->
    <circle cx="300" cy="140" r="9" fill="#8b9bb4" />
  </g>

  <!-- Decorative HUD/Data elements (Left/Center-left) -->
  <g transform="translate(120, 90)">
    <!-- Hexagon icon -->
    <polygon points="30,0 55,15 55,45 30,60 5,45 5,15" fill="none" stroke="url(#magenta-glow)" stroke-width="2" filter="url(#glow-soft)" />
    <polygon points="30,8 48,18 48,42 30,52 12,42 12,18" fill="none" stroke="#ff0844" stroke-width="1" opacity="0.6" />
    <!-- Pulse dot inside -->
    <circle cx="30" cy="30" r="4" fill="#ffffff" class="glowing-node-treason" />
  </g>

  <!-- Title & Branding -->
  <g transform="translate(200, 190)">
    <!-- Title with glowing effect and split gradient -->
    <text class="title-text" x="0" y="0">
      THE TREASON
    </text>
    <text class="title-text" x="0" y="60" fill="url(#magenta-glow)" filter="url(#glow-soft)">
      HYPOTHESIS
    </text>
    
    <!-- Subtitle / Description -->
    <text class="subtitle-text" x="0" y="110">
      COVERT AI MISALIGNMENT MAP
    </text>
  </g>

  <!-- Status indicators -->
  <g transform="translate(200, 330)" font-family="monospace" font-size="11" fill="#8b9bb4">
    <circle cx="10" cy="-4" r="4" fill="#ff0844" class="glowing-node-treason" />
    <text x="22" y="0" fill="#ffb199">STATUS: ACTIVE THREAT MODELING</text>
    
    <circle cx="280" cy="-4" r="4" fill="#00ff87" />
    <text x="292" y="0" fill="#a8ffda">DECEPTIVE ALIGNMENT: AUDITING</text>
  </g>

</svg>
